name: CI

on:
  push:
    branches: [main, d797-kernel-migration]
  pull_request:
    branches: [main]

# Cancel an in-flight CI run if a newer commit lands on the same ref.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

# Skip CI on PR sync events from the changesets/release-plz bot. Same
# rationale as graphrefly-rs/.github/workflows/ci.yml — see the long
# comment block there. In short: the bot's release PRs add only
# mechanical version bumps + changelog entries on top of code that was
# already tested by the push:main run that triggered the bot. The
# post-merge "chore: release packages" push will run CI again before
# changesets-action publishes.

jobs:
  check:
    if: "${{ (github.event_name != 'pull_request' || github.actor != 'graphrefly-write-content[bot]') && (github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'chore: release')) }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Root-eval qualification materializes its frozen task baseline from
          # an exact historical commit. Keep CI fail-closed without replacing
          # that baseline with HEAD or a synthetic fixture.
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Enable Corepack (pnpm)
        run: |
          corepack enable
          corepack install

      - run: pnpm install --frozen-lockfile

      - name: Check out the pinned root conformance fixture
        uses: actions/checkout@v7
        with:
          repository: graphrefly/graphrefly
          ref: e0b4383af15bdfbf3b522dab7f35fdcfa42a460f
          path: .tmp/conformance-root
          sparse-checkout: spec/fixtures
          persist-credentials: false

      - name: Run the shared D808 behavioral and refusal probes
        run: pnpm exec tsx scripts/probe-d797-rereview.ts .tmp/conformance-root/spec/fixtures/d797-rereview.v1.json
      - name: Run the shared D809 node naming probes
        run: pnpm exec tsx scripts/probe-node-naming.ts .tmp/conformance-root/spec/fixtures/node-naming.v1.json

      - run: pnpm test

      - run: pnpm run lint

      - run: pnpm run build
        env:
          # tsup's declaration worker needs the same heap budget as the proven
          # release build once every focused package entry is emitted together.
          NODE_OPTIONS: --max-old-space-size=6144

      # The docs build runs against the clean-slate @graphrefly/ts package and
      # explicitly historical/archive pages.
      - name: Docs build
        run: pnpm run docs:build
        env:
          ASTRO_SITE_URL: https://graphrefly.dev
          ASTRO_BASE_PATH: /
          NODE_OPTIONS: --max-old-space-size=6144

      # Clean-slate TS B49 probe.
      - name: Benchmark smoke
        run: pnpm bench
